name: github_flutter
version: 0.0.1
description: A lightweight high-level GitHub API Client Library that uses Github's v3 API
homepage: https://github.com/RubberDuckCrew/github_flutter/

environment:
  sdk: 3.9.2
  flutter: "3.35.3"

dependencies:
  flutter:
    sdk: flutter
  graphql: 5.2.2
  http: 1.5.0
  http_parser:
